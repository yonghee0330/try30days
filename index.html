<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try30Days</title>
<meta name="description" content="부모와 아이가 습관을 하나씩 걸고 30일 동안 함께 바꾸는 가족 챌린지">
<meta name="theme-color" content="#f1f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Try30Days">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div class="shell">
  <div class="stage fb" id="stage" hidden>
    <canvas id="c3d" aria-label="우리 가족의 집. 드래그해서 돌려 볼 수 있어요."></canvas>
    <div id="fallback"></div>
    <div class="hud" id="hud" hidden>
      <div class="tag"><b id="hDay">Day 1</b><small id="hTod"></small></div>
      <div class="hud-r"><div class="tag stat"><b id="hStreak">0</b><small>스트릭</small></div><div class="tag stat"><b id="hTogether">0</b><small>함께한 날</small></div></div>
    </div>
  </div>
  <main id="main" class="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="메뉴" hidden>
  <button data-act="tab" data-v="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>우리 집</button>
  <button data-act="tab" data-v="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</button>
  <button data-act="tab" data-v="promise"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>약속</button>
  <button data-act="tab" data-v="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>더보기</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">이 앱은 자바스크립트가 켜져 있어야 동작해요.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
